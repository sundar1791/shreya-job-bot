# Career Ops — London E-commerce Portal Configuration
# Scanner targets for Shreya's job search (ops/vendor/catalogue/platform roles)

title_filter:
  include:
    - operations
    - vendor
    - seller
    - catalogue
    - catalog
    - platform
    - marketplace
    - onboarding
    - merchandising
    - e-commerce
    - ecommerce
    - content ops
    - data governance
  # Roles must also contain one of these seniority indicators
  seniority_include:
    - specialist
    - associate
    - coordinator
    - analyst
    - executive
    - advisor
    - lead
  exclude:
    - junior
    - graduate
    - intern
    - apprentice
    - engineer
    - developer
    - software
    - data scientist
    - data analyst
    - machine learning
    - finance
    - accounting
    - financial
    - hr
    - human resources
    - recruiter
    - talent
    - sales
    - business development
    - logistics
    - supply chain
    - warehouse
    - driver
    - delivery
    - demand planning
    - forecasting

location_filter:
  include:
    - london
    - hybrid
    - remote
    - uk
    - united kingdom
    - greater london

companies:
  # ── Greenhouse ATS (API + Playwright fallback) ───────────────────
  - name: Etsy
    career_url: https://careers.etsy.com
    ats: greenhouse
    greenhouse_id: etsy

  - name: Moonpig
    career_url: https://www.moonpig.com/uk/careers
    ats: greenhouse
    greenhouse_id: moonpig

  - name: Auto Trader UK
    career_url: https://careers.autotrader.co.uk
    ats: greenhouse
    greenhouse_id: autotrader

  # ── Playwright only (Greenhouse API disabled, page still accessible) ─
